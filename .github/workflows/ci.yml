name: ci

on:
  push:
  pull_request:

jobs:
  solver-free:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install -e .
      - run: python -m pytest -m "not gurobi"

  gurobi-required:
    if: ${{ vars.ENABLE_LICENSED_GUROBI_TESTS == 'true' }}
    runs-on: [self-hosted, windows, gurobi-13]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install -e .
      - run: python -m pytest -m gurobi
