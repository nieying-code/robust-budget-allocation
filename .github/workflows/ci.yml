name: ci

on:
  push:
  pull_request:

jobs:
  solver-free:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install -e .
      - run: python -m pytest -m "not gurobi"

  gurobi-required:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Disabled unless a runner with Gurobi 13.0.2 and a valid license is configured."
