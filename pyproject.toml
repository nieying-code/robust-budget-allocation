[build-system]
requires = ["setuptools>=75,<76"]
build-backend = "setuptools.build_meta"

[project]
name = "robust-budget-allocation"
version = "0.1.0"
description = "Two-stage robust allocation of budget among quantity, reliability, and flexibility"
requires-python = "==3.12.10"
dependencies = [
  "Pyomo==6.10.1",
  "gurobipy==13.0.2",
]

[project.optional-dependencies]
dev = ["pytest==8.4.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "gurobi: requires Gurobi 13.0.2 and a valid license",
]
